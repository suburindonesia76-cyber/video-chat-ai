<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Chat AI - Aya</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#14101d; --bg2:#1e1629; --card:#241b33; --accent:#e879a8; --accent2:#a78bfa;
    --text:#f3edf7; --muted:#a79fb8; --bubble-bot:#2c2240; --bubble-user:#7c3a5e;
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #2b1e42 0%, var(--bg) 60%);
    color:var(--text); display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  /* ===== VIDEO STAGE (tampilan utama ala video call) ===== */
  #stage{
    position:relative; flex:1 1 auto; min-height:220px; margin:10px 12px 0;
    border-radius:22px; overflow:hidden; background:#000;
    border:1px solid rgba(232,121,168,.35);
  }
  #stageVideo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #stage.talking #stageVideo{ animation:stagePulse 1.4s ease-in-out infinite; }
  @keyframes stagePulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.035);} }
  .stage-top{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:space-between; padding:10px 12px;
    background:linear-gradient(rgba(0,0,0,.6), transparent);
  }
  .stage-id{ display:flex; align-items:center; gap:9px; }
  .stage-id h1{ font-size:16px; font-weight:700; }
  .stage-id p{ font-size:11px; color:#d8cfe6; }
  .status-dot{ width:9px; height:9px; border-radius:50%; background:#4ade80; box-shadow:0 0 6px #4ade80; flex-shrink:0; }
  .stage-btns{ display:flex; gap:8px; }
  .icon-btn{
    width:40px; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.45); color:var(--text); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px);
  }
  .icon-btn:active{ transform:scale(.93); }
  .stage-bars{
    position:absolute; left:14px; bottom:14px; display:none; align-items:flex-end; gap:3px;
    height:30px; background:rgba(0,0,0,.5); padding:7px 11px; border-radius:14px;
  }
  #stage.talking .stage-bars{ display:flex; }
  .stage-bars span{ width:4px; border-radius:2px; background:var(--accent); animation:bars .5s ease-in-out infinite; }
  .stage-bars span:nth-child(1){ height:10px; }
  .stage-bars span:nth-child(2){ height:18px; animation-delay:.12s; }
  .stage-bars span:nth-child(3){ height:14px; animation-delay:.24s; }
  .stage-bars span:nth-child(4){ height:20px; animation-delay:.36s; }
  .stage-bars span:nth-child(5){ height:12px; animation-delay:.48s; }
  @keyframes bars{ 0%,100%{ transform:scaleY(.4);} 50%{ transform:scaleY(1);} }
  /* ===== CHAT KECIL ===== */
  #chat{
    flex:0 0 30%; min-height:110px; overflow-y:auto;
    padding:10px 12px 4px; display:flex; flex-direction:column; gap:8px;
  }
  .msg{ padding:8px 12px; border-radius:16px; font-size:14px; line-height:1.4;
        animation:pop .25s ease-out; word-wrap:break-word; }
  @keyframes pop{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  .msg.bot{ background:var(--bubble-bot); border-bottom-left-radius:6px; }
  .msg.user{ align-self:flex-end; background:var(--bubble-user); border-bottom-right-radius:6px; max-width:85%; }
  .msg.error{ background:#4c1d1d; border:1px solid #7f2d2d; }
  .msg-row{ display:flex; gap:8px; align-items:flex-end; align-self:flex-start; max-width:94%; animation:pop .25s ease-out; }
  .msg-row .msg{ animation:none; flex:1; min-width:0; }
  .msg-avatar{ width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); flex-shrink:0; }
  .typing{ align-self:flex-start; background:var(--bubble-bot); padding:10px 14px; border-radius:16px;
           border-bottom-left-radius:6px; display:flex; gap:5px; }
  .typing span{ width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,60%,100%{ opacity:.25;} 30%{ opacity:1;} }
  #composer{ display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
             background:rgba(20,14,30,.9); border-top:1px solid rgba(232,121,168,.15); }
  #input{ flex:1; border-radius:24px; border:1px solid rgba(232,121,168,.3); background:var(--bg2);
          color:var(--text); padding:12px 16px; font-size:15px; outline:none; }
  #input:focus{ border-color:var(--accent); }
  #send{ width:48px; height:48px; border-radius:50%; border:none; cursor:pointer; font-size:19px;
         background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; flex-shrink:0; }
  #send:active{ transform:scale(.92); }
  #send:disabled{ opacity:.5; }
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center;
             justify-content:center; z-index:20; padding:20px; }
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--card); border-radius:20px; padding:22px; width:100%; max-width:380px;
          border:1px solid rgba(232,121,168,.25); max-height:85dvh; overflow-y:auto; }
  .modal h2{ font-size:18px; margin-bottom:6px; }
  .modal p{ font-size:13px; color:var(--muted); margin-bottom:12px; line-height:1.5; }
  .modal label{ font-size:13px; color:var(--muted); display:block; margin:10px 0 4px; }
  .modal input, .modal select{ width:100%; border-radius:12px; border:1px solid rgba(232,121,168,.3);
                background:var(--bg2); color:var(--text); padding:10px 12px; font-size:14px; outline:none; }
  .modal .row{ display:flex; gap:8px; margin-top:16px; }
  .btn{ flex:1; padding:12px; border-radius:14px; border:none; font-size:15px; font-weight:600; cursor:pointer; }
  .btn.primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .btn.ghost{ background:transparent; border:1px solid rgba(232,121,168,.35); color:var(--text); }
  .btn.small{ flex:0 0 auto; padding:10px 14px; font-size:13px; }
  .modal a{ color:var(--accent); }
  .model-row{ display:flex; gap:8px; }
  .model-row input{ flex:1; }
  .hint{ text-align:center; font-size:12px; color:var(--muted); padding:4px 0 2px; }
</style>
</head>
<body>

<div id="stage">
  <video id="stageVideo" muted loop playsinline preload="auto" autoplay></video>
  <div class="stage-top">
    <div class="stage-id">
      <span class="status-dot"></span>
      <div><h1>Aya</h1><p>Online</p></div>
    </div>
    <div class="stage-btns">
      <button class="icon-btn" id="muteBtn" title="Bisukan / suarakan">🔊</button>
      <button class="icon-btn" id="settingsBtn" title="Pengaturan">⚙️</button>
    </div>
  </div>
  <div class="stage-bars" id="stageBars"><span></span><span></span><span></span><span></span><span></span></div>
</div>

<div id="chat"></div>
<div class="hint" id="hint"></div>

<div id="composer">
  <input id="input" type="text" placeholder="Ketik pesan..." autocomplete="off" enterkeyhint="send">
  <button id="send" title="Kirim">➤</button>
</div>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Pengaturan</h2>
    <p>Tempel <b>Gemini API key</b> gratis kamu di sini. Key hanya tersimpan di HP ini, tidak dikirim ke mana pun selain Google.</p>
    <p>Belum punya? Ambil gratis di <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></p>
    <label>Gemini API Key</label>
    <input id="apiKeyInput" type="password" placeholder="AIza...">
    <label>Model</label>
    <div class="model-row">
      <input id="modelInput" type="text" placeholder="gemini-3.8-flash">
      <button class="btn ghost small" id="loadModelsBtn" title="Muat daftar model dari API">↻</button>
    </div>
    <label>Pilih dari daftar (setelah tekan ↻)</label>
    <select id="modelSelect"><option value="">— tekan ↻ dulu —</option></select>
    <div class="row">
      <button class="btn ghost" id="closeSettings">Tutup</button>
      <button class="btn primary" id="saveSettings">Simpan</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn ghost" id="testSoundBtn">🔊 Tes suara</button>
    </div>
    <div id="ttsStatus" style="font-size:12px;color:#9fb3c8;min-height:16px;"></div>
  </div>
</div>

document.getElementById('loadModelsBtn').onclick = async () => {
  const key = apiKeyInput.value.trim();
  if (!key) { alert('Isi API key dulu.'); return; }
  const btn = document.getElementById('loadModelsBtn');
  btn.textContent = '…'; btn.disabled = true;
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const models = (data.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'));
    modelSelect.innerHTML = '';
    if (!models.length) modelSelect.innerHTML = '<option value="">Tidak ada model ditemukan</option>';
    models.forEach(m => {
      const name = m.name.replace('models/', '');
      const o = document.createElement('option');
      o.value = name; o.textContent = name;
      modelSelect.appendChild(o);
    });
    if (models.length) {
      const cur = modelInput.value.trim();
      const match = models.some(m => m.name.replace('models/','') === cur);
      modelSelect.value = match ? cur : modelSelect.options[0].value;
      modelInput.value = modelSelect.value;
    }
  } catch(e) {
    alert('Gagal memuat daftar model: ' + e.message);
  }
  btn.textContent = '↻'; btn.disabled = false;
};
modelSelect.onchange = () => { if (modelSelect.value) modelInput.value = modelSelect.value; };

function addMsg(text, who, isError){
  if (who === 'bot') {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const img = document.createElement('img');
    img.className = 'msg-avatar';
    img.src = AVATAR_IMG;
    img.alt = 'Aya';
    const d = document.createElement('div');
    d.className = 'msg bot' + (isError ? ' error' : '');
    d.textContent = text;
    row.appendChild(img);
    row.appendChild(d);
    chat.appendChild(row);
  } else {
    const d = document.createElement('div');
    d.className = 'msg user';
    d.textContent = text;
    chat.appendChild(d);
  }
  chat.scrollTop = chat.scrollHeight;
}

function setTtsStatus(s){
  const el = document.getElementById('ttsStatus');
  if (el) el.textContent = s ? ('Status suara: ' + s) : '';
}

function showVoiceFail(){
  hint.textContent = '🔇 Suara gagal diputar di HP ini. Buka ⚙️ → tekan Tes suara, lalu kirim tulisan statusnya ke saya.';
}

function browserTts(text, cb){
  const fin = (ok) => { setTtsStatus(ok ? 'OK (suara HP)' : 'gagal total'); if (!ok) showVoiceFail(); cb(); };
  try {
    if (!('speechSynthesis' in window)) { fin(false); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.slice(0, 400));
    u.lang = 'id-ID'; u.rate = 1.02; u.pitch = 1.1;
    let done = false;
    const once = (ok) => { if (done) return; done = true; fin(ok); };
    u.onend = () => once(true);
    u.onerror = () => once(false);
    setTimeout(() => once(false), 12000);
    speechSynthesis.speak(u);
  } catch(_) { fin(false); }
}

function playDataUri(uri){
  return new Promise((resolve) => {
    const a = new Audio();
    currentAudio = a;
    let done = false;
    const fin = () => { if (done) return; done = true; resolve(); };
    a.onended = fin; a.onerror = fin;
    try {
      a.src = uri;
      const pr = a.play();
      if (pr && pr.catch) pr.catch(fin);
    } catch(_) { fin(); }
    setTimeout(fin, 30000);
  });
}

async function geminiTts(text){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=' + encodeURIComponent(apiKey);
  const body = {
    contents: [{ parts: [{ text: 'Ucapkan seperti gadis muda yang ceria, manja, dan natural: ' + text }] }],
    generationConfig: {
      responseModalities: ['AUDIO'],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Leda' } } }
    }
  };
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const part = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0];
  const b64 = part && part.inlineData && part.inlineData.data;
  if (!b64) throw new Error('no audio');
  let rate = 24000;
  const m = (part.inlineData.mimeType || '').match(/rate=(\d+)/);
  if (m) rate = parseInt(m[1], 10);
  return { b64, rate };
}

function pcmToWavUri(b64, rate){
  const bin = atob(b64), len = bin.length;
  const buf = new ArrayBuffer(44 + len), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + len, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, 'data'); v.setUint32(40, len, true);
  for (let i = 0; i < len; i++) v.setUint8(44 + i, bin.charCodeAt(i));
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, bytes.length)));
  return 'data:audio/wav;base64,' + btoa(s);
}

async function playTts(text){
  const tk = ++ttsToken;
  const alive = () => tk === ttsToken && !muted;
  const clean = text.replace(/[*_#`]/g, '').trim().slice(0, 500);
  if (!clean || !alive()) return;
  if (apiKey) {
    try {
      setTtsStatus('menyiapkan suara…');
      const r = await geminiTts(clean);
      if (!alive()) return;
      await playDataUri(pcmToWavUri(r.b64, r.rate));
      if (alive()) setTtsStatus('OK');
      return;
    } catch(e) { /* lanjut ke cadangan */ }
  }
  const chunks = (clean.match(/[^.!?…]+[.!?…]+/g) || [clean]).map(s => s.trim()).filter(Boolean).slice(0, 6);
  for (const chunk of chunks) {
    if (!alive()) return;
    let ok = false;
    for (const eng of TTS_ENGINES) {
      if (!alive()) return;
      ok = await new Promise((resolve) => {
        const a = new Audio();
        currentAudio = a;
        let done = false;
        const fin = (r) => { if (done) return; done = true; resolve(r); };
        a.onended = () => fin(true);
        a.onerror = () => fin(false);
        try {
          a.src = eng(chunk.slice(0, 200));
          const pr = a.play();
          if (pr && pr.catch) pr.catch(() => fin(false));
        } catch(_) { fin(false); }
        setTimeout(() => fin(false), 15000);
      });
      if (ok) break;
    }
    if (!ok) await new Promise((res) => browserTts(chunk, res));
  }
  if (alive()) setTtsStatus('OK');
}

document.getElementById('testSoundBtn').onclick = () => {
  unlockAudio();
  if (muted) { muted = false; localStorage.setItem('aya_muted', '0'); updateMuteIcon(); }
  setTtsStatus('mengetes…');
  speak('Halo! Ini suara Aya. Kalau kamu mendengar ini, berarti suara sudah berfungsi.');
};

function stopSpeak(){
  ttsToken++; speakSeq++;
  if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
  if (currentAudio) { try { currentAudio.pause(); } catch(_){} currentAudio = null; }
  stage.classList.remove('talking');
  try { stageVideo.play().catch(()=>{}); } catch(_){}
}

// video avatar hanya bergerak saat bot "berbicara", mengikuti chat
async function speak(text){
  stopSpeak();
  const seq = ++speakSeq;
  const clean = text.replace(/[*_#`]/g, '').trim().slice(0, 500);
  if (!clean) return;
  const stillMine = () => seq === speakSeq;
  stage.classList.add('talking');
  try { stageVideo.play().catch(()=>{}); } catch(_){}
  if (muted) {
    const dur = Math.min(20000, Math.max(4000, clean.length * 110));
    await new Promise(r => setTimeout(r, dur));
  } else {
    await playTts(clean);
  }
  if (stillMine()) {
    stage.classList.remove('talking');
  }
}

let cachedModels = null;
async function getModelList(){
  if (cachedModels) return cachedModels;
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  cachedModels = (data.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace('models/', ''))
    .filter(n => !/tts|embedding|image|vision|thinking/i.test(n))
    .sort((a, b) => (b.includes('flash') ? 1 : 0) - (a.includes('flash') ? 1 : 0));
  return cachedModels;
}

function buildSystemPrompt(){
  const today = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  return SYSTEM_PROMPT + '\nHari ini: ' + today + '. Jika ditanya hari/tanggal, jawab berdasarkan info ini.'
    + '\nPENTING: Langsung jawab saja. JANGAN tampilkan proses berpikirmu, instruksi, atau penjelasan tambahan.';
}

async function tryModel(modelName, contents){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: buildSystemPrompt() }] },
      contents,
      generationConfig: { maxOutputTokens: 300, temperature: 0.9 }
    })
  });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const j = await res.json(); if (j.error && j.error.message) msg = j.error.message; } catch(_){}
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  let text = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
  if (!text) throw new Error('Respons kosong dari AI.');
  // jika model membocorkan proses berpikir (* Option, * Constraint, dsb),
  // ambil kalimat jawaban terakhir yang diapit tanda kutip
  if (/\*\s*(Option|Constraint|Max \d+ sentences)/i.test(text)) {
    const quotes = [...text.matchAll(/"([^"]+)"/g)].map(m => m[1]);
    if (quotes.length) text = quotes[quotes.length - 1];
  }
  return text;
}

async function askGemini(){
  const contents = history.slice(-12).map(m => ({
    role: m.who === 'user' ? 'user' : 'model',
    parts: [{ text: m.text }]
  }));
  let candidates = [model];
  try {
    const others = (await getModelList()).filter(m => m !== model);
    candidates = candidates.concat(others);
  } catch(_) {}
  let lastErr = null;
  for (const m of candidates) {
    try { return await tryModel(m, contents); }
    catch(e) {
      lastErr = e;
      if (e.status === 400) break;
    }
  }
  let msg = lastErr ? lastErr.message : 'Tidak diketahui';
  if (lastErr && (lastErr.status === 503 || /high demand|overloaded|try again later/i.test(msg)))
    msg = 'Server AI sedang sibuk semua, coba lagi beberapa saat.';
  throw new Error(msg);
}

async function send(){
  const text = input.value.trim();
  if (!text || busy) return;
  if (!apiKey) { settingsModal.classList.add('open'); return; }
  busy = true; sendBtn.disabled = true;
  unlockAudio();
  stopSpeak();
  input.value = '';
  addMsg(text, 'user');
  history.push({ who:'user', text });
  showTyping();
  try {
    const reply = await askGemini();
    hideTyping();
    history.push({ who:'bot', text: reply });
    addMsg(reply, 'bot');
    speak(reply);
  } catch(e) {
    hideTyping();
    addMsg('Maaf, ada gangguan: ' + e.message, 'bot', true);
  }
  busy = false; sendBtn.disabled = false;
  input.focus();
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

setTimeout(() => {
  const greet = 'Hai! Aku Aya. Senang ketemu kamu! Mau ngobrol apa hari ini?';
  addMsg(greet, 'bot');
  history.push({ who:'bot', text: greet });
  speak(greet);
}, 600);
